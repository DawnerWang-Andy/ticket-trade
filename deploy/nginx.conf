# Nginx 反向代理示例：/etc/nginx/sites-available/tickettrade
# 启用：ln -s /etc/nginx/sites-available/tickettrade /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# HTTPS：certbot --nginx -d your-domain.com（自动改写本文件加入证书）
server {
    listen 80;
    server_name your-domain.com;   # 改成你的域名

    # 上传与超时
    client_max_body_size 10m;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:8321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态图片可加浏览器缓存
    location /img/ {
        proxy_pass http://127.0.0.1:8321;
        expires 7d;
        add_header Cache-Control "public";
    }
}
